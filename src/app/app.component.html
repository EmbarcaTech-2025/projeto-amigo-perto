<main class="main-container">
  <header class="app-header">
    <h1>Amigo Perto</h1>
    <p>Conecte-se e monitore seu dispositivo Bluetooth.</p>
  </header>

  <div class="content-area">
    <app-device-info 
      [deviceName]="bluetoothService.deviceInfo()?.name ?? null" 
      [isConnected]="bluetoothService.connectionStatus() === 'connected'"
      (connect)="onConnect()" 
      (disconnect)="onDisconnect()" />

    @if (bluetoothService.connectionStatus() === 'connected') {
      <app-rssi-radar [rssi]="bluetoothService.rssi()" />
    }
  </div>
</main>
