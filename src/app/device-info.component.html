<div class="device-info-card">
  @if (isConnected()) {
    <div class="device-header">
      <h3>{{ deviceName() }}</h3>
      <button class="disconnect-button" (click)="disconnect.emit()">Disconnect</button>
    </div>
    <div class="device-controls">
      <button (click)="toggleBuzzer()" [class.active]="isBuzzerOn()">Buzzer</button>
      <button (click)="toggleLed()" [class.active]="isLedOn()">LED</button>
    </div>
  } @else {
    <div class="no-device">
      <p>No device connected.</p>
      <button class="connect-button" (click)="connect.emit()">Connect to Device</button>
    </div>
  }
</div>
