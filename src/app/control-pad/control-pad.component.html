<div class="d-pad-container">
  <div class="d-pad">
    <!-- Cima: Comando 1 -->
    <button class="up" (click)="command.emit(1)">▲</button>

    <!-- Esquerda: Comando 0 (Parar) -->
    <button class="left" (click)="command.emit(0)">◀</button>

    <!-- Centro: Comando 0 (Parar) -->
    <button class="center" (click)="command.emit(0)"></button>

    <!-- Direita: Comando 0 (Parar) -->
    <button class="right" (click)="command.emit(0)">▶</button>

    <!-- Baixo: Comando 1 (Unificado) -->
    <button class="down" (click)="command.emit(1)">▼</button>
  </div>
</div>
