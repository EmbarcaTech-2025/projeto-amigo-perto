# Logger module
CONFIG_LOG=y

# Button and LED library
CONFIG_DK_LIBRARY=y

# Bluetooth LE
CONFIG_BT=y

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Amigo Perto"

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# PWM Support
CONFIG_PWM=y

# ADC Support for battery monitoring
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# Energy Test Module (remova após testes ou configure =n no Kconfig)
CONFIG_ENERGY_TEST=y
CONFIG_ADC_ASYNC=y
CONFIG_FPU=y

# Shell para ler resultados via USB (resultados ficam na RAM até reset)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
